# Render blueprint for the backend (free web service).
# The repo root is checked out so backend/ can read ../queries/*.cypher.
services:
  - type: web
    name: follow-the-money-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        value: falkordb
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_TLS
        value: "false"
      # LLM: OpenRouter free models (primary + fallback). API keys are dashboard-set
      # (sync: false) — never pin them here.
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TIMEOUT_S
        value: "20"
      - key: LLM_FALLBACK_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_FALLBACK_MODEL
        value: cohere/north-mini-code:free
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: AGENT_BUDGET_S
        value: "90"
      - key: CORS_ORIGINS
        sync: false
      - key: BACKEND_API_TOKEN
        generateValue: true
